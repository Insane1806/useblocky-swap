
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UseBlocky - Swap</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

<header class="top">
    <div class="brand">
        <span class="logo">UseBlocky</span>
        <span class="net" id="networkName">Not connected</span>
    </div>
    <button class="conn" id="connectButton">Connect Wallet</button>
</header>

<main class="card">
    <h2>Swap</h2>

    <div class="row">
        <label for="fromAmount">From</label>
        <input type="number" id="fromAmount"
               value="1.5" min="0" step="any"
               placeholder="0.00" inputmode="decimal"
               aria-describedby="fromError">
        <span class="tok">ETH</span>
    </div>

    <p class="field-error" id="fromError"></p>

    <div class="row r2">
        <label for="toAmount">To</label>
        <input type="text" id="toAmount"
               placeholder="Estimated amount" readonly>
        <span class="tok">USDT</span>
    </div>

    <button class="go" id="swapButton">Swap</button>

    <div class="status" id="statusMessage"
         role="status" aria-live="polite" hidden>
        <strong id="statusTitle"></strong>
        <p id="statusText"></p>
    </div>

    <div class="network-info">
        <div class="network-row">
            <span>Network</span>
            <strong id="networkDetail">Not connected</strong>
        </div>

        <div class="network-row">
            <span>Slippage tolerance</span>
            <strong>0.5%</strong>
        </div>
    </div>
</main>

</body>
</html>
